name: Build SharkWRT APK

on:
  push:
    paths:
      - "sharkwrt.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-sharkwrt-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: SharkWRT
      APP_VERSION: "1.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Unzip project
        run: |
          set -euo pipefail
          test -f sharkwrt.zip
          rm -rf app _gen
          mkdir app
          unzip -q sharkwrt.zip -d app
          test -f app/pubspec.yaml
          test -f app/signing/sideload.jks

      - name: Use JDK 17
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          fi

      - name: Install Flutter (stable)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter setup
        run: |
          set -euo pipefail
          flutter --version
          flutter config --no-analytics
          flutter precache --android
          yes | flutter doctor --android-licenses > /dev/null 2>&1 || true

      - name: Generate android platform
        run: |
          set -euo pipefail
          flutter create --org com.sharkwrt --project-name sharkwrt --platforms android --no-pub _gen
          cp -r _gen/android app/android

      - name: Pub get and analyze
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze || true

      - name: Patch android (manifest, icons)
        working-directory: app
        run: python3 tool/patch_android.py .

      - name: Build release APK
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --obfuscate --split-debug-info=build/symbols
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Select signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "Using your own keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KS_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASS=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "Using bundled sideload key (testing only, not for stores)"
            echo "KS_FILE=$GITHUB_WORKSPACE/app/signing/sideload.jks" >> "$GITHUB_ENV"
            echo "KS_ALIAS=sharkwrt" >> "$GITHUB_ENV"
            echo "KS_PASS=sharkwrt-sideload" >> "$GITHUB_ENV"
            echo "KEY_PASS=sharkwrt-sideload" >> "$GITHUB_ENV"
          fi

      - name: Align, sign and verify
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)"
          echo "build-tools: $BT"
          mkdir -p dist
          IN="app/build/app/outputs/flutter-apk/app-release.apk"
          OUT="dist/${APP_NAME}-v${APP_VERSION}-build${{ github.run_number }}.apk"
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS_FILE" --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${APP_NAME} v${APP_VERSION} (build ${{ github.run_number }})" \
            --notes "Release APK (arm + arm64). Sideload build: not store-signed unless KEYSTORE secrets are set."
