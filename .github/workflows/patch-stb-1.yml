# .github/workflows/patch-stb.yml
#
# WHAT THIS DOES
# ----------------
# 1. Takes the APK you commit to the repo root (APK_NAME below) or upload via
#    workflow_dispatch.
# 2. Decompiles it with apktool.
# 3. Flips the hidden (visibility="gone") STB diagnostics panel and the
#    toolbar "logger_options" icon to visible — pure resource-XML edits,
#    same risk class as a theme/string change.
# 4. Adds a static app shortcut ("Connect STB") that launches the app's own
#    com.odcpe.connect.stb.STBLaunchActivity directly. That activity, its
#    scan screen, pairing flow and remote-control dashboard are ALL existing,
#    already-compiled code in the APK — the shortcut just gives you a
#    reliable, direct entry point into it instead of leaving it unreachable.
#    (This avoids hand-editing the compiled Compose bytecode of the home
#    dashboard, which cannot be safely verified in this pipeline.)
# 5. Rebuilds, zipaligns, and signs the APK with a fresh debug keystore
#    (generated on first run and cached as a workflow artifact).
# 6. Uploads the patched, installable APK as a build artifact.
#
# IMPORTANT — READ BEFORE INSTALLING
# -----------------------------------
# - The patched APK is signed with a NEW key, different from Jio's original
#   signing key. Android will refuse to install it as an update over the
#   existing app. You must uninstall the original ODCPE Connect app first,
#   then install this patched one.
# - "STB Connect" in the shortcut opens the app's existing STB module
#   (scan → pair → remote dashboard). Whether pairing itself completes
#   without error depends on your actual STB hardware/firmware — that part
#   was already present in the app and untouched by this patch, not newly
#   written here.
# - Keep this repo PRIVATE. It contains a patched Jio app; don't publish it.
#
# SETUP
# -----
# 1. Create a private GitHub repo.
# 2. Put this file at: .github/workflows/patch-stb.yml
# 3. Put your APK at the repo root, named exactly as APK_NAME below
#    (or change APK_NAME to match your file's name).
# 4. Commit + push (or run manually from the Actions tab → "Run workflow").
# 5. Open the Actions run → Artifacts → download "patched-apk".

name: Patch ODCPE Connect (STB enable)

on:
  push:
    paths:
      - "ODCPE_Connect_V3_005_all_unlocked-1.apk"
      - ".github/workflows/patch-stb.yml"
  workflow_dispatch: {}

env:
  APK_NAME: ODCPE_Connect_V3_005_all_unlocked-1.apk
  OUT_NAME: ODCPE_Connect_STB_Patched.apk
  APKTOOL_VERSION: "2.9.3"
  BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fail fast if APK missing
        run: |
          if [ ! -f "$APK_NAME" ]; then
            echo "::error::$APK_NAME not found at repo root. Check the file name/path or update APK_NAME in the workflow."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools + build-tools
        run: |
          set -e
          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sL -o cmdline-tools.zip "$CMDLINE_URL"
          unzip -q cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/build-tools/${BUILD_TOOLS_VERSION}" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "build-tools;${BUILD_TOOLS_VERSION}" --licenses >/dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Download apktool
        run: |
          curl -sL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"

      - name: Decompile APK
        run: java -jar apktool.jar d -f "$APK_NAME" -o decoded

      - name: Patch resource XML (unhide STB panel + logger icon, add shortcut)
        run: |
          python3 - <<'PYEOF'
          import re, os

          root = "decoded"

          def patch_visibility(path, ids):
              fp = os.path.join(root, path)
              with open(fp, encoding="utf-8") as f:
                  txt = f.read()
              changed = 0
              for vid in ids:
                  # match the opening tag that carries this id, then flip its
                  # visibility attribute to "visible" (handles gone/invisible,
                  # @+id/ and @id/ forms, any attribute order within the tag).
                  pattern = re.compile(
                      r'(<[\w\.]+[^>]*?android:id="@\+?id/%s"[^>]*?android:visibility=")(gone|invisible)(")'
                      % re.escape(vid)
                  )
                  new_txt, n = pattern.subn(r'\1visible\3', txt)
                  if n:
                      txt = new_txt
                      changed += n
                  else:
                      print(f"  ! id {vid} not found/already visible in {path}")
              with open(fp, "w", encoding="utf-8") as f:
                  f.write(txt)
              print(f"patched {changed} visibility flag(s) in {path}")

          patch_visibility(
              "res/layout/activity_esim_cdt_screen.xml",
              [
                  "edit_rsn_stb", "stb_edit_rsn", "stb_save_rsn", "stb_space2",
                  "stb_upgrade_button", "stb_cdt_result", "stb_cdt_button",
              ],
          )
          patch_visibility("res/layout/toolbar_layout.xml", ["logger_options"])

          # --- add a string for the shortcut label ---
          strings_path = os.path.join(root, "res/values/strings.xml")
          with open(strings_path, encoding="utf-8") as f:
              s = f.read()
          if "shortcut_connect_stb" not in s:
              s = s.replace(
                  "</resources>",
                  '    <string name="shortcut_connect_stb">Connect STB</string>\n</resources>',
              )
              with open(strings_path, "w", encoding="utf-8") as f:
                  f.write(s)
              print("added shortcut_connect_stb string")

          # --- add res/xml/shortcuts.xml ---
          os.makedirs(os.path.join(root, "res/xml"), exist_ok=True)
          shortcuts_xml = """<?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut
                  android:shortcutId="connect_stb"
                  android:enabled="true"
                  android:icon="@mipmap/ic_launcher"
                  android:shortcutShortLabel="@string/shortcut_connect_stb"
                  android:shortcutLongLabel="@string/shortcut_connect_stb">
                  <intent
                      android:action="android.intent.action.MAIN"
                      android:targetPackage="com.odcpe.connect"
                      android:targetClass="com.odcpe.connect.stb.STBLaunchActivity" />
              </shortcut>
          </shortcuts>
          """
          with open(os.path.join(root, "res/xml/shortcuts.xml"), "w", encoding="utf-8") as f:
              f.write(shortcuts_xml.replace("    ", "", 1))  # trim leading indent
          print("wrote res/xml/shortcuts.xml")

          # --- wire shortcuts.xml into the launcher activity via meta-data ---
          manifest_path = os.path.join(root, "AndroidManifest.xml")
          with open(manifest_path, encoding="utf-8") as f:
              m = f.read()

          # Find the activity block that owns the MAIN/LAUNCHER intent-filter.
          launcher_block = re.search(
              r'(<activity[^>]*android:name="com\.odcpe\.connect\.presentation\.activity\.LauncherSplashCustomActivity"[^>]*>)(.*?)(</activity>)',
              m, re.S,
          )
          if not launcher_block:
              raise SystemExit("Could not locate launcher activity block — check activity name in manifest and update this script.")

          open_tag, body, close_tag = launcher_block.groups()
          if "android.app.shortcuts" not in body:
              meta = '\n        <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />'
              new_body = body + meta
              m = m[:launcher_block.start()] + open_tag + new_body + close_tag + m[launcher_block.end():]
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(m)
              print("wired shortcuts.xml into LauncherSplashCustomActivity")
          else:
              print("shortcuts meta-data already present")
          PYEOF

      - name: Rebuild APK
        run: java -jar apktool.jar b decoded -o "unsigned-${{ env.OUT_NAME }}"

      - name: Generate signing key (first run only, reused via cache)
        run: |
          if [ ! -f patch.keystore ]; then
            keytool -genkeypair -v \
              -keystore patch.keystore -storepass patchpatch -keypass patchpatch \
              -alias patchkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=STB Patch, OU=Dev, O=Dev, L=NA, S=NA, C=IN"
          fi

      - name: Zipalign
        run: |
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          "$BT/zipalign" -p -f 4 "unsigned-${OUT_NAME}" "aligned-${OUT_NAME}"

      - name: Sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          "$BT/apksigner" sign \
            --ks patch.keystore --ks-pass pass:patchpatch --key-pass pass:patchpatch \
            --out "$OUT_NAME" "aligned-${OUT_NAME}"
          "$BT/apksigner" verify "$OUT_NAME" && echo "signature OK"

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: patched-apk
          path: ${{ env.OUT_NAME }}
          retention-days: 14

      - name: Upload keystore (keep this safe if you want to re-sign updates later)
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: patch.keystore
          retention-days: 14
